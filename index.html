<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>GET OUTTA MY ROOM</title>
  <link rel="icon" type="image/png" href="/resources/images/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/resources/images/favicon.svg" />
  <link rel="shortcut icon" href="/resources/images/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/resources/images/apple-touch-icon.png" />
  <link rel="manifest" href="/resources/images/site.webmanifest" />
</head>
<body>
  <div id="initial-loading-screen" class="initial-loading-screen" aria-busy="true" aria-label="Loading game">
    <div class="window initial-loading-window">
      <div class="title-bar">
        <div class="title-bar-text">Get Outta My Room</div>
      </div>
      <div class="window-body initial-loading-body">
        <p class="initial-loading-disclaimer">
          Disclaimer: this game won&rsquo;t have to load when installed locally (and it runs better) &lt;3 thx for playing
        </p>
        <div class="field-row initial-loading-row initial-loading-row--stretch">
          <label id="initial-loading-progress-label">Progress</label>
          <!-- Omit value so UA draws classic infinite/busy progress stripes -->
          <progress id="initial-loading-bar" class="initial-loading-bar" max="100" aria-labelledby="initial-loading-progress-label" aria-describedby="initial-loading-caption"></progress>
        </div>
      </div>
      <div class="status-bar">
        <p class="status-bar-field">Busy</p>
        <button type="button" class="btn" disabled>Cancel</button>
      </div>
    </div>
  </div>
  <div id="container">
    <button id="backButton" class="inactive">BACK</button>
    <div id="mission-hud" class="mission-hud" aria-live="polite" hidden>
      <div id="mission-list" class="mission-list"></div>
    </div>
    
    <div id="inventory">
      <div id="phone">
        <img src="./resources/images/phone.png" alt="Phone" id="phoneImage"></img>
      </div>
      <div id="hand">
        <img src="./resources/images/hand.png" alt="Hand" id="handImage" style="pointer-events: none;"></img>
      </div>
    </div>
    <div id="dopamine-container">
      <span id="dopamine-count">0</span><img src="./resources/images/dopamine.svg" alt="Dopamine" id="dopamine-image">
    </div>
    
    <div id="inventory-container">
      <div id="item-info-block" class="window" style="display: none;"></div>
      <button id="inventory-button">Back<br>Pack</button>
      <div id="inventory-items" class="window">
        <div class="status-bar-field inventory-item-container"></div>
        <div class="status-bar-field inventory-item-container"></div>
        <div class="status-bar-field inventory-item-container"></div>
        <div class="status-bar-field inventory-item-container"></div>
        <div class="status-bar-field inventory-item-container"></div>
        <div class="status-bar-field inventory-item-container"></div>
        <div class="status-bar-field inventory-item-container"></div>
        <div class="status-bar-field inventory-item-container"></div>
        <div class="status-bar-field inventory-item-container"></div>
      </div>
      <span id="enemy-active-items-title" style="color: white; position: absolute; top: 100px; left: 50%; transform: translateX(-50%);">Enemy's Active Items</span>
      <div id="enemy-active-items" class="status-bar">
        <span></span>
        <div class="status-bar-field enemy-active-item-container"></div>
        <div class="status-bar-field enemy-active-item-container"></div>
      </div>
      <div id="active-items" class="status-bar">
        <!-- If you add shit here it breaks the charging system. -->
        <span style="color: white; padding-bottom: 10px;">Active Items</span>
        <div class="status-bar-field active-item-container"></div>
        <div class="status-bar-field active-item-container"></div>
      </div>
    </div>
    <div id="battleMode">
      <div id="enemyHealthContainer" class="progress-container">
        <progress id="enemyHealth" value="50" max="100">
          <div class="progress-value"></div>
        </progress>
        <span id="enemyHealthText">50 / 100</span>
      </div>
      <div id="playerHealthContainer" class="progress-container">
        <progress id="playerHealth" value="50" max="100">
          <div class="progress-value"></div>
        </progress>
        <span id="playerHealthText">50 / 100</span>
      </div>
    </div>
    <div id="overlay">
      <div id="full-overlay"></div>
      <div id="bottom-overlay">[Click on the CD to start]</div>
      <div class="window" id="window-overlay">
        <div class="title-bar">
          <div class="title-bar-text" id="window-title"></div>
          <div class="title-bar-controls">
            <button aria-label="Close"></button>
          </div>
        </div>
        <div class="window-body">
          <p id="window-message"></p>
          <div id="window-buttons"></div>
        </div>
      </div>
      <div id="dialogue-overlay">
        <div id="dialogue-speaker"></div>
        <div id="dialogue-countdown" aria-live="polite"></div>
        <div id="dialogue-box"></div>
        <div id="dialogue-triangle">▼</div>
      </div>
    </div>
    <div id="shop">
      <div id="shop-items">
        <div class="shop-item-container" id="shop-item-container1"></div>
        <div class="shop-item-container" id="shop-item-container2"></div>
        <div class="shop-item-container" id="shop-item-container3"></div>
      </div>
      <div id="shop-controls">
        <!-- <div class="shop-item-container" id="sell-spot">Place Item Here to Sell</div> -->
        <!-- <button id="reroll-button">Reroll</button> -->
      </div>
      
    </div>
    <div id="computer"></div>
    <div id="pain-container"></div>
    <div id="self-pain-container"></div>
    <div id="screen-fx-flash"></div>
    <div id="eyelids">
      <div id="topEye"></div>
      <div id="bottomEye"></div>
    </div>
</div>
  
  <script type="module" src="./js/game.js"></script>
</body>
</html>
