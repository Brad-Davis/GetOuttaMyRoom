<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Evil Youtube</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #ffffff;
        font-family: Roboto, system-ui, -apple-system, sans-serif;
      }

      .stage {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .image-frame {
        --design-w: 1250;
        --design-h: 911;
        /* Live embed over the blank player (youtube.png at native resolution) */
        --video-left: 145;
        --video-top: 140;
        --video-width: 640;
        --video-height: 400;
        /* Comment box below the player */
        --overlay-left: 145;
        --overlay-top: 690;
        --overlay-width: 640;

        container-type: inline-size;
        position: relative;
        aspect-ratio: var(--design-w) / var(--design-h);
        max-width: 100vw;
        max-height: 100vh;
        width: min(100vw, calc(100vh * var(--design-w) / var(--design-h)));
        height: min(100vh, calc(100vw * var(--design-h) / var(--design-w)));
      }

      .frame-image {
        position: absolute;
        inset: 0;
        z-index: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        user-select: none;
        pointer-events: none;
      }

      .video-player {
        position: absolute;
        z-index: 1;
        left: calc(var(--video-left) * 100% / var(--design-w));
        top: calc(var(--video-top) * 100% / var(--design-h));
        width: calc(var(--video-width) * 100% / var(--design-w));
        height: calc(var(--video-height) * 100% / var(--design-h));
        border: none;
        background: #000;
      }

      .overlay {
        position: absolute;
        z-index: 2;
        left: calc(var(--overlay-left) * 100% / var(--design-w));
        top: calc(var(--overlay-top) * 100% / var(--design-h));
        width: calc(var(--overlay-width) * 100% / var(--design-w));
        padding: clamp(10px, 2.8cqw, 16px);
        background: #ffffff;
        height: 200px;
      }
      .overlay label {
        display: block;
        margin-bottom: 8px;
        font-size: clamp(11px, 2.9cqw, 13px);
        font-weight: 600;
        color: #000000;
      }
      .overlay textarea {
        width: 100%;
        min-height: clamp(72px, 18cqw, 100px);
        padding: 10px 12px;
        font-family: inherit;
        font-size: clamp(12px, 3cqw, 14px);
        line-height: 1.4;
        color: #000000;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid #000000;
        border-radius: 6px;
        resize: none;
        margin-bottom: 12px;
        box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.1);
      }
      .overlay textarea:focus {
        outline: none;
        border-color: #ff4444;
        box-shadow: 0 0 0 2px rgba(255, 68, 68, 0.25);
      }
      .overlay button {
        padding: clamp(8px, 1.7cqw, 10px) clamp(14px, 2.7cqw, 18px);
        font-size: clamp(12px, 3cqw, 14px);
        font-weight: 600;
        color: #fff;
        cursor: pointer;
        background: #cc0000;
        border: none;
        border-radius: 24px;
      }
      .overlay button:hover {
        background: #990000;
      }
      .overlay-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .overlay button.is-listening {
        background: #b24020;
      }
      .overlay button.is-listening:hover {
        background: #8a3018;
      }
      .overlay button[type='submit'] {
        background: #282828;
      }
      .overlay button[type='submit']:hover {
        background: #111111;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="image-frame">
        <img
          class="frame-image"
          src="/resources/images/youtube.png"
          alt="Evil Youtube"
          draggable="false"
        />

        <iframe
          id="youtube-player"
          class="video-player"
          title="Youtube video player"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen
        ></iframe>

        <form class="overlay" id="evil-form" aria-label="Comment">
          <label for="comment">Leave a toxic comment &lt;3</label>
          <textarea id="comment" name="comment" rows="4" placeholder="CLICK SPEAK BELOW TO START AND SPEAK INTO THE MIC"></textarea>
          <div class="overlay-actions">
            <button type="button" id="speak-btn" aria-pressed="false">Speak</button>
            <button type="submit">Submit</button>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="/js/evilYoutube/evilYoutubeVoice.js"></script>
  </body>
</html>
