    <audio id="room" preload="auto" webkit-playsinline playsinline>
        <source src="./audio/room.mp3" type="audio/mpeg">

    </video>
    <p id="reaction"></p>
    <div id="volume-visualizer"></div>
    <div id="modal">
        <h1 id="daddyTitle">Please Wake Up Daddy!</h1>
        <img alt="dad's face" src="./imgs/DADDY.png" />
        <div ontouchstart="">
            <div class="button" id="Start">
                <a href="#" id="start">Start!</a>
            </div>
            <div id="PlayAgain">
                <div class="button" id="playAgainButton">
                    <a href="#" id="playAgain">Play Again?</a>
                </div>

            </div>
            
        </div>
        <h4>Made by Alex Vrahas and Brad Davis</h4>
    </div>

    <div id="output">
    </div>
