<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Evil LinkedIn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #ffffff;
        font-family: Roboto, system-ui, -apple-system, sans-serif;
      }

      /*
        The image + overlay live inside .image-frame, which always matches the same
        on-screen rectangle as object-fit: contain for this aspect ratio.

        Tune overlay position against your PSD / 1920×1080 screenshot:
        --overlay-left / --overlay-top / --overlay-width are in *design pixels* (same coords as Photoshop).
      */
      .stage {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .image-frame {
        --design-w: 2000;
        --design-h: 2000;
        /* Box position/size on the design canvas (evilLinkedIn.png at native resolution) */
        --overlay-left: 110;
        --overlay-top: 1180;
        --overlay-width: 1310;

        container-type: inline-size;
        position: relative;
        aspect-ratio: var(--design-w) / var(--design-h);
        max-width: 100vw;
        max-height: 100vh;
        width: min(100vw, calc(100vh * var(--design-w) / var(--design-h)));
        height: min(100vh, calc(100vw * var(--design-h) / var(--design-w)));
      }

      .frame-image {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        user-select: none;
        pointer-events: none;
      }

      .overlay {
        position: absolute;
        z-index: 1;
        left: calc(var(--overlay-left) * 100% / var(--design-w));
        top: calc(var(--overlay-top) * 100% / var(--design-h));
        width: calc(var(--overlay-width) * 100% / var(--design-w));
        padding: clamp(10px, 2.8cqw, 16px);
        border-radius: 8px;
        background: #ffffff;
        height: 200px;
      }
      .overlay label {
        display: block;
        margin-bottom: 8px;
        font-size: clamp(11px, 2.9cqw, 13px);
        font-weight: 600;
        color: #000000;
      }
      .overlay textarea {
        width: 100%;
        min-height: clamp(72px, 18cqw, 100px);
        padding: 10px 12px;
        font-family: inherit;
        font-size: clamp(12px, 3cqw, 14px);
        line-height: 1.4;
        color: #000000;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid #000000;
        border-radius: 6px;
        resize: none;
        margin-bottom: 12px;
        box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.1);
      }
      .overlay textarea:focus {
        outline: none;
        border-color: #70b7ff;
        box-shadow: 0 0 0 2px rgba(112, 183, 255, 0.25);
      }
      .overlay button {
        padding: clamp(8px, 1.7cqw, 10px) clamp(14px, 2.7cqw, 18px);
        font-size: clamp(12px, 3cqw, 14px);
        font-weight: 600;
        color: #fff;
        cursor: pointer;
        background: #0a66c2;
        border: none;
        border-radius: 24px;
      }
      .overlay button:hover {
        background: #004182;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="image-frame">
        <img
          class="frame-image"
          src="/resources/images/evilLinkedIn.png"
          alt="Evil LinkedIn"
          draggable="false"
        />

        <form class="overlay" id="evil-form" aria-label="Comment">
          <label for="comment">Prove your self worth!!!</label>
          <textarea id="comment" name="comment" rows="4" placeholder="Type here…"></textarea>
          <button type="submit">Submit</button>
        </form>
      </div>
    </div>

    <script>
      (function () {
        var GOMR_COMPUTER_SUBMIT = 'GOMR_COMPUTER_SUBMIT';
        document.getElementById('evil-form').addEventListener('submit', function (e) {
          e.preventDefault();
          var text = document.getElementById('comment').value;
          if (window.parent !== window) {
            window.parent.postMessage({ type: GOMR_COMPUTER_SUBMIT, v: 1, text: text }, '*');
          }
        });
      })();
    </script>
  </body>
</html>
